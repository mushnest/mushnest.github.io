<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#ef857d" media="(prefers-color-scheme: light)">
        <meta name="theme-color" content="#332322" media="(prefers-color-scheme: dark)">
        <title>mushnest</title>
        <link rel="stylesheet" type="text/css" href="css/styles.css">
        <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
        <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
        <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon-180x180.png">
    </head>
    <body>
        <div class="bgGradient" aria-hidden="true">
            <span class="bgBlob bgBlob1"></span>
            <span class="bgBlob bgBlob2"></span>
            <span class="bgBlob bgBlob3"></span>
            <span class="bgBlob bgBlob4"></span>
            <span class="bgBlob bgBlob5"></span>
            <span class="bgBlob bgBlob6"></span>
        </div>
        <header>
            <a class="LOGO" href="https://mushnest.com/">mushnest</a>
            <div class="headerButton">
                <a href="#cafe" class="donateQrButton">赞赏
                    <img src="images/qrcode_mushnest.png" alt="赞赏二维码" aria-hidden="true">
                </a>
                <a href="about.html">关于</a>
            </div>
        </header>
        <main>
            <div class="indexVersion">6.1.0</div>
            <h1>关于我们</h1>
            <div class="mainContainer">
                <img src="images/qrcode_mushnest_2.png">
                <h2>简介 &#128221;</h2>
                <div>mushnest</div>
                <div class="rowLineClass"></div>
                <div>始于2019年，致力于通过表情给大家带来欢乐。现在已有像素方块头和像素猪粉粉两大系列</div>
            </div>
            <div class="mainContainer">
                <img src="images/qrcode_mushnest_2.png">
                <h2>联系方式 &#128140;</h2>
                <div>邮箱</div>
                <div class="rowLineClass"></div>
                <div>mushnest@outlook.com</div>
            </div>
            <div id="cafe" class="mainContainer">
                <img src="images/qrcode_mushnest.png">
                <h2>赞赏 &#127873;</h2>
                <div>赞赏途径</div>
                <div class="rowLineClass"></div>
                <div>微信扫描左侧二维码，进入任意专辑页面进行赞赏吧</div>
            </div>
        </main>
        <footer>
            <div>Copyright © 2019 - 2026 mushnest. All Rights Reserved.</div>
        </footer>
        <script>
            window.addEventListener("load", function () {
                setTimeout(function () {
                    document.body.classList.add("bgBlobsFrozen");
                }, 5000);
            });
        </script>
        <script>
            (function () {
                var donateLinks = document.querySelectorAll(".donateQrButton");
                var cafeCard = document.getElementById("cafe");
                if (!donateLinks.length || !cafeCard) return;

                function pulseCafe() {
                    if (cafeCard.classList.contains("donatePulse")) return;
                    cafeCard.classList.add("donatePulse");
                    setTimeout(function () {
                        cafeCard.classList.remove("donatePulse");
                    }, 1900);
                }

                for (var i = 0; i < donateLinks.length; i++) {
                    donateLinks[i].addEventListener("click", pulseCafe);
                }
            })();
        </script>
    </body>
</html>
